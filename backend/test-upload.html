<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Gallery Upload Test</h1>
    
    <form id="uploadForm">
        <div class="form-group">
            <label for="user_id">User ID:</label>
            <input type="text" id="user_id" name="user_id" value="1" required>
        </div>
        
        <div class="form-group">
            <label for="images">Images:</label>
            <input type="file" id="images" name="images" multiple accept="image/*">
        </div>
        
        <div class="form-group">
            <label for="videos">Videos:</label>
            <input type="file" id="videos" name="videos" multiple accept="video/*">
        </div>
        
        <button type="submit">Upload Files</button>
        <button type="button" onclick="testDebug()">Test Debug Route</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData();
            const user_id = document.getElementById('user_id').value;
            const images = document.getElementById('images').files;
            const videos = document.getElementById('videos').files;
            
            formData.append('user_id', user_id);
            
            // Add images
            for (let i = 0; i < images.length; i++) {
                formData.append('images', images[i]);
            }
            
            // Add videos
            for (let i = 0; i < videos.length; i++) {
                formData.append('videos', videos[i]);
            }
            
            try {
                const response = await fetch('http://localhost:8888/gallery/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                const resultDiv = document.getElementById('result');
                resultDiv.className = result.status ? 'result success' : 'result error';
                resultDiv.innerHTML = `
                    <h3>${result.status ? 'Success' : 'Error'}</h3>
                    <p><strong>Message:</strong> ${result.msg}</p>
                    ${result.data ? `<p><strong>Uploaded:</strong> ${result.data.uploaded_count} files</p>` : ''}
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
            } catch (error) {
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>Error</h3>
                    <p><strong>Message:</strong> ${error.message}</p>
                `;
            }
        });

        async function testDebug() {
            const formData = new FormData();
            const user_id = document.getElementById('user_id').value;
            const images = document.getElementById('images').files;
            const videos = document.getElementById('videos').files;
            
            formData.append('user_id', user_id);
            
            // Add images
            for (let i = 0; i < images.length; i++) {
                formData.append('images', images[i]);
            }
            
            // Add videos
            for (let i = 0; i < videos.length; i++) {
                formData.append('videos', videos[i]);
            }
            
            try {
                const response = await fetch('http://localhost:8888/gallery/debug', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h3>Debug Test Result</h3>
                    <p><strong>Status:</strong> ${result.status}</p>
                    <p><strong>Message:</strong> ${result.msg}</p>
                    <p><strong>Files Found:</strong> ${result.files.length}</p>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
                
            } catch (error) {
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>Debug Test Error</h3>
                    <p><strong>Message:</strong> ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
